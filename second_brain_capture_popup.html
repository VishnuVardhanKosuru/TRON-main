<div style="max-width:380px;margin:0 auto;background:var(--surface-1);border-radius:20px 20px 0 0;padding:16px 14px;border:0.5px solid var(--border-strong);">
  <h2 class="sr-only">Mockup of the chat-style capture popup showing a captured note and a confirmation reply</h2>
  <div style="width:36px;height:4px;background:var(--border-strong);border-radius:2px;margin:0 auto 16px;"></div>

  <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
    <div style="background:var(--fill-accent);color:var(--on-accent);border-radius:14px 14px 2px 14px;padding:9px 13px;max-width:75%;font-size:14px;">
      soak dry fruits every night 9pm
    </div>
  </div>

  <div style="display:flex;justify-content:flex-start;margin-bottom:18px;">
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px 14px 14px 2px;padding:9px 13px;max-width:75%;">
      <div style="display:flex;align-items:center;gap:6px;">
        <i class="ti ti-check" style="font-size:14px;color:var(--text-success);" aria-hidden="true"></i>
        <span style="font-size:13px;color:var(--text-secondary);">Saved as a routine, daily 9:00 pm</span>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;background:var(--surface-2);border:0.5px solid var(--border-accent);border-radius:14px;padding:11px 13px;">
    <span style="font-size:14px;color:var(--text-muted);flex:1;">Type or speak...</span>
    <i class="ti ti-microphone" style="font-size:18px;color:var(--text-accent);" aria-hidden="true"></i>
  </div>
</div>
