<div style="max-width:380px;margin:0 auto;background:var(--surface-1);border-radius:20px;padding:16px 14px;border:0.5px solid var(--border-strong);">
  <h2 class="sr-only">Mockup of the menu screen with a grid of content type cards and utility items below</h2>

  <p style="font-size:22px;font-weight:500;margin:0 0 14px;">Menu</p>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px;">
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:11px;">
      <i class="ti ti-bulb" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <p style="font-size:12px;margin:8px 0 0;">Ideas</p>
      <p style="font-size:10px;color:var(--text-muted);margin:1px 0 0;">14 entries</p>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:11px;">
      <i class="ti ti-link" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <p style="font-size:12px;margin:8px 0 0;">Links</p>
      <p style="font-size:10px;color:var(--text-muted);margin:1px 0 0;">22 entries</p>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:11px;">
      <i class="ti ti-notebook" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <p style="font-size:12px;margin:8px 0 0;">Journal</p>
      <p style="font-size:10px;color:var(--text-muted);margin:1px 0 0;">31 entries</p>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:11px;">
      <i class="ti ti-heart" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <p style="font-size:12px;margin:8px 0 0;">Gratitude</p>
      <p style="font-size:10px;color:var(--text-muted);margin:1px 0 0;">9 entries</p>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:11px;">
      <i class="ti ti-users" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <p style="font-size:12px;margin:8px 0 0;">People</p>
      <p style="font-size:10px;color:var(--text-muted);margin:1px 0 0;">6 profiles</p>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:11px;">
      <i class="ti ti-shopping-cart" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <p style="font-size:12px;margin:8px 0 0;">Shopping</p>
      <p style="font-size:10px;color:var(--text-muted);margin:1px 0 0;">5 items</p>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:11px;">
      <i class="ti ti-flask" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <p style="font-size:12px;margin:8px 0 0;">Stock</p>
      <p style="font-size:10px;color:var(--text-muted);margin:1px 0 0;">1 running low</p>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:11px;">
      <i class="ti ti-scale" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <p style="font-size:12px;margin:8px 0 0;">Borrowed/IOUs</p>
      <p style="font-size:10px;color:var(--text-muted);margin:1px 0 0;">3 open</p>
    </div>
  </div>

  <div style="border-top:0.5px solid var(--border);padding-top:10px;">
    <div style="display:flex;align-items:center;gap:10px;padding:9px 2px;">
      <i class="ti ti-repeat" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px;flex:1;">Manage routines</span>
      <i class="ti ti-chevron-right" style="font-size:15px;color:var(--text-muted);" aria-hidden="true"></i>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:9px 2px;">
      <i class="ti ti-clipboard-check" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px;flex:1;">Weekly review</span>
      <i class="ti ti-chevron-right" style="font-size:15px;color:var(--text-muted);" aria-hidden="true"></i>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:9px 2px;">
      <i class="ti ti-settings" style="font-size:17px;color:var(--text-secondary);" aria-hidden="true"></i>
      <span style="font-size:13px;flex:1;">Settings</span>
      <i class="ti ti-chevron-right" style="font-size:15px;color:var(--text-muted);" aria-hidden="true"></i>
    </div>
  </div>
</div>
