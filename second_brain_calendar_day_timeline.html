<div style="max-width:380px;margin:0 auto;background:var(--surface-1);border-radius:20px;padding:16px 14px;border:0.5px solid var(--border-strong);">
  <h2 class="sr-only">Redesigned calendar with a scrollable date strip and an hourly day timeline showing tasks at their scheduled times</h2>

  <div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px;padding:8px 0;border-radius:12px;">
      <span style="font-size:10px;color:var(--text-muted);">Mon</span>
      <span style="font-size:14px;color:var(--text-secondary);">1</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px;padding:8px 0;border-radius:12px;">
      <span style="font-size:10px;color:var(--text-muted);">Tue</span>
      <span style="font-size:14px;color:var(--text-secondary);">2</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px;padding:8px 4px;border-radius:12px;background:var(--fill-accent);">
      <span style="font-size:10px;color:var(--on-accent);">Wed</span>
      <span style="font-size:14px;font-weight:500;color:var(--on-accent);">3</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px;padding:8px 0;border-radius:12px;position:relative;">
      <span style="font-size:10px;color:var(--text-muted);">Thu</span>
      <span style="font-size:14px;color:var(--text-secondary);">4</span>
      <div style="width:4px;height:4px;background:var(--fill-accent);border-radius:50%;"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px;padding:8px 0;border-radius:12px;">
      <span style="font-size:10px;color:var(--text-muted);">Fri</span>
      <span style="font-size:14px;color:var(--text-secondary);">5</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:2px;min-width:38px;padding:8px 0;border-radius:12px;">
      <span style="font-size:10px;color:var(--text-muted);">Sat</span>
      <span style="font-size:14px;color:var(--text-secondary);">6</span>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;background:var(--bg-danger);border-radius:10px;padding:8px 12px;margin-bottom:14px;">
    <i class="ti ti-alert-circle" style="font-size:14px;color:var(--text-danger);" aria-hidden="true"></i>
    <span style="font-size:12px;color:var(--text-danger);">Anytime · Pay rent (overdue)</span>
  </div>

  <div style="position:relative;">
    <div style="display:flex;gap:10px;margin-bottom:26px;">
      <span style="font-size:11px;color:var(--text-muted);width:40px;flex-shrink:0;">9 am</span>
      <div style="flex:1;border-top:0.5px solid var(--border);"></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:26px;align-items:center;">
      <span style="font-size:11px;color:var(--text-muted);width:40px;flex-shrink:0;">12 pm</span>
      <div style="flex:1;border-top:0.5px solid var(--border);"></div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;">
      <span style="font-size:11px;color:var(--text-muted);width:40px;flex-shrink:0;padding-top:10px;">6 pm</span>
      <div style="flex:1;border-top:0.5px solid var(--border);position:relative;">
        <div class="c-purple" style="border-radius:10px;padding:8px 12px;margin-top:8px;">
          <span class="t" style="font-size:13px;">Mom's birthday call</span>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;">
      <span style="font-size:11px;color:var(--text-muted);width:40px;flex-shrink:0;padding-top:10px;">9 pm</span>
      <div style="flex:1;border-top:0.5px solid var(--border);position:relative;">
        <div class="c-teal" style="border-radius:10px;padding:8px 12px;margin-top:8px;">
          <span class="t" style="font-size:13px;">Soak dry fruits</span>
        </div>
      </div>
    </div>
  </div>
</div>
