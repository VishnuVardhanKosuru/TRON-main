<div style="max-width:380px;margin:0 auto;background:var(--surface-1);border-radius:20px;padding:18px 14px;border:0.5px solid var(--border-strong);">
  <h2 class="sr-only">Refined home screen with a progress ring and urgency-grouped task list</h2>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <div>
      <p style="font-size:12px;color:var(--text-muted);margin:0;">Thursday, 3 sep</p>
      <p style="font-size:23px;font-weight:500;margin:3px 0 0;">Good morning</p>
    </div>
    <svg width="46" height="46" viewBox="0 0 46 46">
      <circle cx="23" cy="23" r="19" fill="none" stroke="var(--surface-2)" stroke-width="5"/>
      <circle cx="23" cy="23" r="19" fill="none" stroke="var(--fill-accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="68" transform="rotate(-90 23 23)"/>
      <text x="23" y="27" text-anchor="middle" style="font-size:12px;font-weight:500;fill:var(--text-primary);">3/7</text>
    </svg>
  </div>

  <p style="font-size:11px;color:var(--text-danger);margin:0 0 6px;letter-spacing:0.3px;">OVERDUE</p>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 2px;margin-bottom:4px;">
    <i class="ti ti-square" style="font-size:18px;color:var(--text-danger);flex-shrink:0;" aria-hidden="true"></i>
    <i class="ti ti-checkbox" style="font-size:12px;color:var(--text-muted);" aria-hidden="true"></i>
    <span style="font-size:14px;flex:1;">Pay rent</span>
  </div>

  <p style="font-size:11px;color:var(--text-muted);margin:14px 0 6px;letter-spacing:0.3px;">TODAY</p>

  <div style="display:flex;align-items:center;gap:10px;padding:10px 2px;">
    <i class="ti ti-square" style="font-size:18px;color:var(--text-muted);flex-shrink:0;" aria-hidden="true"></i>
    <i class="ti ti-repeat" style="font-size:12px;color:var(--text-muted);" aria-hidden="true"></i>
    <span style="font-size:14px;flex:1;">Fill timesheet</span>
    <span style="font-size:11px;color:var(--text-accent);background:var(--bg-accent-muted);padding:2px 8px;border-radius:10px;">12d</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 2px;">
    <i class="ti ti-square" style="font-size:18px;color:var(--text-muted);flex-shrink:0;" aria-hidden="true"></i>
    <i class="ti ti-bell" style="font-size:12px;color:var(--text-muted);" aria-hidden="true"></i>
    <span style="font-size:14px;flex:1;">Mom's birthday call</span>
    <span style="font-size:11px;color:var(--text-muted);">6 pm</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 2px;">
    <i class="ti ti-square" style="font-size:18px;color:var(--text-muted);flex-shrink:0;" aria-hidden="true"></i>
    <i class="ti ti-checkbox" style="font-size:12px;color:var(--text-muted);" aria-hidden="true"></i>
    <span style="font-size:14px;flex:1;">Call plumber</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:10px 2px;opacity:0.5;">
    <i class="ti ti-square-rounded-check" style="font-size:18px;color:var(--text-success);flex-shrink:0;" aria-hidden="true"></i>
    <i class="ti ti-repeat" style="font-size:12px;color:var(--text-muted);" aria-hidden="true"></i>
    <span style="font-size:14px;flex:1;text-decoration:line-through;color:var(--text-muted);">Soak dry fruits</span>
  </div>
</div>
