<div style="max-width:380px;margin:0 auto;background:var(--surface-1);border-radius:20px;padding:18px 10px 14px;border:0.5px solid var(--border-strong);">
  <h2 class="sr-only">Updated navigation bar with Synapse replacing Library</h2>
  <div style="display:flex;align-items:flex-end;justify-content:space-around;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <i class="ti ti-home" style="font-size:22px;color:var(--text-accent);" aria-hidden="true"></i>
      <span style="font-size:10px;color:var(--text-accent);">Home</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <i class="ti ti-calendar" style="font-size:22px;color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:10px;color:var(--text-muted);">Calendar</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;transform:translateY(-14px);">
      <div style="width:52px;height:52px;border-radius:50%;background:var(--fill-accent);display:flex;align-items:center;justify-content:center;border:3px solid var(--surface-1);">
        <i class="ti ti-plus" style="font-size:24px;color:var(--on-accent);" aria-hidden="true"></i>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <i class="ti ti-atom-2" style="font-size:22px;color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:10px;color:var(--text-muted);">Synapse</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <i class="ti ti-menu-2" style="font-size:22px;color:var(--text-muted);" aria-hidden="true"></i>
      <span style="font-size:10px;color:var(--text-muted);">Menu</span>
    </div>
  </div>
</div>
